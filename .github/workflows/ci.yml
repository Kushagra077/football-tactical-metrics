# pytest + ruff on every push and PR. Must be green (spec: "Tests + CI
# green on every push"). Network/integration tests are skipped here via
# `-m "not integration"` — CI stays offline and ~seconds fast, same as
# A1's fake-backend suite.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-uv publishes no floating major tags (no `v10`) — pin the full version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # --locked: fail if uv.lock is stale rather than silently re-resolving.
      # Python version comes from .python-version.
      - name: Install
        run: uv sync --locked --extra dev --extra app

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -m "not integration" -q

  # Optional second job: run scripts/validate.py against a tiny committed
  # fixture and fail if any validation check regresses. Enable once the
  # pipeline produces real numbers.
  # validate:
  #   runs-on: ubuntu-latest
  #   steps: ...
