[project]
name = "football-tactical-metrics"
version = "0.1.0"
description = "Source-agnostic tactical + physical metrics from professional football tracking data, validated against synthetic ground truth."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"

# Runtime deps are listed in requirements.txt (that file is what the HF
# Space installs). Mirror the important ones here so `pip install -e .`
# alone is enough for tests.
dependencies = [
    "kloppy",
    "pandas",
    "numpy",
    "scipy",
    "shapely",
    "pyarrow",
    "pyyaml",
    "mplsoccer",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
app = ["streamlit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftm"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: hits the network / real provider data; skipped in CI",
]
