[project]
name = "football-tactical-metrics"
version = "0.1.0"
description = "Source-agnostic tactical + physical metrics from professional football tracking data, validated against synthetic ground truth."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"

# Runtime dependencies only. Test/lint tooling lives in the `dev` extra and
# the dashboard in the `app` extra; uv.lock pins the full resolved set.
dependencies = [
    "kloppy",
    "pandas",
    "numpy",
    "scipy",
    "shapely",
    "pyarrow",
    "pyyaml",
    "mplsoccer",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.7"]
app = ["streamlit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftm"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "app", "tests"]
# Notebooks are exploration scratch, not library code; keep them out of lint.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: hits the network / real provider data; skipped in CI",
]
